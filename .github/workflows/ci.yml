name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      node_dirs: ${{ steps.find.outputs.node_dirs }}
      python_dirs: ${{ steps.find.outputs.python_dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Find projects
        run: |
          node_dirs=$(find apps scripts projects -maxdepth 2 -name package.json -not -path '*/node_modules/*' 2>/dev/null | xargs -r -n1 dirname | jq -R . | jq -sc .)
          python_dirs=$(find apps scripts projects -maxdepth 2 -name pyproject.toml 2>/dev/null | xargs -r -n1 dirname | jq -R . | jq -sc .)
          echo "node_dirs=${node_dirs:-[]}" >> "$GITHUB_OUTPUT"
          echo "python_dirs=${python_dirs:-[]}" >> "$GITHUB_OUTPUT"

  node:
    needs: discover
    if: needs.discover.outputs.node_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.node_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then npm run lint; else echo "no lint script"; fi
      - name: Test
        run: |
          if jq -e '.scripts.test' package.json >/dev/null && ! jq -r '.scripts.test' package.json | grep -qi 'no test specified'; then
            npm test
          else
            echo "no tests yet"
          fi

  python:
    needs: discover
    if: needs.discover.outputs.python_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.python_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: |
          if [ -d tests ]; then uv run pytest -q; else echo "no tests yet"; fi
